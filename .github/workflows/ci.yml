name: BIBO Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Build, Lint, Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      SESSION_SECRET: "ci_pipeline_dummy_session_secret_256bit_key_for_testing"
      DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db?sslmode=disable"
      DATABASE_URL_UNPOOLED: "postgresql://ci_user:ci_pass@localhost:5432/ci_db?sslmode=disable"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: Run Automated Test Suites
        run: npm test

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
